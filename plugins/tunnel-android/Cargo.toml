[package]
name = "tauri-plugin-tunnel-android"
version = "0.1.0"
authors = [ "Nelomai" ]
description = ""
edition = "2021"
rust-version = "1.88"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-tunnel-android"

[dependencies]
tauri = { version = "2.11.3" }
serde = "1.0"
thiserror = "2"
zeroize = "1"
nelomai-client-tunnel = { path = "../../crates/client-tunnel" }
nelomai-contracts = { path = "../../crates/contracts" }
async-trait = "0.1"

[dev-dependencies]
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
