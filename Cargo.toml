[workspace]
members = [
    "crates/client-api",
    "crates/client-application",
    "crates/client-core",
    "crates/client-container",
    "crates/android-container",
    "crates/client-storage",
    "crates/client-tunnel",
    "crates/client-updater",
    "crates/contracts",
    "crates/unix-service",
    "crates/windows-service",
    "plugins/tunnel-android",
    "plugins/push-android",
    "plugins/updater-android",
    "spikes/desktop-helper",
    "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"

# IPC tests authenticate the actual test executable by hashing it. Linux DWARF
# sections are not runtime code and can otherwise dominate the bounded exchange.
# Keep checks/assertions enabled; do not alter shipping release profiles.
[profile.test]
debug = 0

# The real Windows factory reauthenticates signed installed bytes inside its
# unchanged 30s native call budget. Use the shipping arithmetic optimization
# for signature verification; test assertions and every reread stay enabled.
[profile.test.package.curve25519-dalek]
opt-level = 3

# Execute the full native lifecycle with optimized runtime/record checks while
# retaining the test profile's assertions and both unchanged watchdog bounds.
[profile.test.package.nelomai-contracts]
opt-level = 1

[profile.test.package.nelomai-windows-service]
opt-level = 1
