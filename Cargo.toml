[workspace]
members = [
    "crates/client-api",
    "crates/client-application",
    "crates/client-core",
    "crates/client-container",
    "crates/android-container",
    "crates/client-storage",
    "crates/client-tunnel",
    "crates/client-updater",
    "crates/contracts",
    "crates/unix-service",
    "crates/windows-service",
    "plugins/tunnel-android",
    "plugins/push-android",
    "plugins/updater-android",
    "spikes/desktop-helper",
    "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"

# IPC tests authenticate the actual test executable by hashing it. Linux DWARF
# sections are not runtime code and can otherwise dominate the bounded exchange.
# Keep checks/assertions enabled; do not alter shipping release profiles.
[profile.test]
debug = 0
