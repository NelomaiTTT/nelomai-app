[package]
name = "nelomai-app"
version = "0.1.7"
description = "Native Nelomai client"
authors = ["Nelomai"]
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nelomai_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-tunnel-android = { path = "../plugins/tunnel-android" }
tauri-plugin-push-android = { path = "../plugins/push-android" }
tauri-plugin-updater-android = { path = "../plugins/updater-android" }
nelomai-client-api = { path = "../crates/client-api" }
nelomai-client-application = { path = "../crates/client-application" }
nelomai-client-core = { path = "../crates/client-core" }
nelomai-client-storage = { path = "../crates/client-storage" }
nelomai-client-tunnel = { path = "../crates/client-tunnel" }
nelomai-client-updater = { path = "../crates/client-updater" }
nelomai-contracts = { path = "../crates/contracts" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util"] }

[target.'cfg(windows)'.dependencies]
nelomai-windows-service = { path = "../crates/windows-service" }
tauri-plugin-single-instance = "=2.4.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nelomai-unix-service = { path = "../crates/unix-service" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
notify-rust = "=4.11.7"
tauri-plugin-notification = "2"
tauri-plugin-updater = "=2.10.1"
