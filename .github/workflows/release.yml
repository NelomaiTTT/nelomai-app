name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия без префикса v"
        required: true
        type: string
      release_notes:
        description: "Описание релиза"
        required: false
        type: string
      critical:
        description: "Критическое обновление"
        required: false
        default: false
        type: boolean
      minimum_supported:
        description: "Минимально поддерживаемая версия"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  verify:
    name: Обязательные проверки
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Установить зависимости Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - run: python -m pip install "cryptography>=45,<46"
      - run: python contracts/python/validate_fixtures.py
      - run: python scripts/release-workflow-check.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    needs: verify
    name: ${{ matrix.platform }}-${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            architecture: x86_64
            package_kind: appimage
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - platform: windows
            architecture: x86_64
            package_kind: nsis
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
          - platform: macos
            architecture: aarch64
            package_kind: app
            runner: macos-14
            rust_target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.rust_target }}
      - uses: actions/setup-go@v5
        if: matrix.platform == 'macos'
        with:
          go-version: '1.24.x'
      - name: Установить зависимости Linux
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Установить версию релиза
        shell: bash
        run: python scripts/set-release-version.py "${RELEASE_VERSION#v}"
      - name: Подготовить системную часть Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cargo build --release --target "${{ matrix.rust_target }}" -p nelomai-windows-service
          ./scripts/windows/prepare-runtime.ps1
      - name: Подготовить системную часть Unix
        if: matrix.platform == 'linux' || matrix.platform == 'macos'
        shell: bash
        run: |
          cargo build --release --target "${{ matrix.rust_target }}" -p nelomai-unix-service
          scripts/unix/prepare-runtime.sh "${{ matrix.platform }}" "${{ matrix.rust_target }}"
      - name: Собрать подписанный пакет
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NELOMAI_UPDATER_PUBLIC_KEY: ${{ secrets.NELOMAI_UPDATER_PUBLIC_KEY }}
        run: |
          test -n "$NELOMAI_UPDATER_PUBLIC_KEY"
          npm run tauri build -- \
            --target "${{ matrix.rust_target }}" \
            --config "src-tauri/bundle.${{ matrix.platform }}.conf.json" \
            --bundles "${{ matrix.package_kind }}"
      - name: Собрать артефакт релиза
        shell: bash
        run: |
          python scripts/collect-release-artifact.py \
            --search-root "target/${{ matrix.rust_target }}/release/bundle" \
            --output-dir release-output \
            --version "${RELEASE_VERSION#v}" \
            --platform "${{ matrix.platform }}" \
            --architecture "${{ matrix.architecture }}" \
            --package-kind "${{ matrix.package_kind }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.architecture }}
          path: release-output/
          if-no-files-found: error
          retention-days: 3

  build-android:
    needs: verify
    name: android-aarch64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: aarch64-linux-android
      - uses: gradle/actions/setup-gradle@v4
      - name: Установить Android SDK и NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Установить версию релиза
        run: python scripts/set-release-version.py "${RELEASE_VERSION#v}"
      - name: Восстановить ключ подписи Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nelomai-android.jks"
          chmod 600 "$RUNNER_TEMP/nelomai-android.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/nelomai-android.jks" >> "$GITHUB_ENV"
      - name: Собрать подписанный APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run tauri -- android build --ci --apk --target aarch64
      - name: Проверить подпись и подготовить APK
        run: |
          apk="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          test -f "$apk"
          apksigner="${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          "$apksigner" verify --verbose "$apk"
          signer_sha256="$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$signer_sha256"
          python scripts/collect-android-release-artifact.py \
            --apk "$apk" \
            --output-dir release-android \
            --version "${RELEASE_VERSION#v}" \
            --signer-sha256 "$signer_sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-aarch64
          path: release-android/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [verify, build, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "cryptography>=45,<46"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-input
      - name: Сформировать и подписать манифест
        env:
          NELOMAI_RELEASE_MANIFEST_PRIVATE_KEY_B64: ${{ secrets.NELOMAI_RELEASE_MANIFEST_PRIVATE_KEY_B64 }}
          RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || '' }}
          RELEASE_CRITICAL: ${{ github.event_name == 'workflow_dispatch' && inputs.critical || 'false' }}
          RELEASE_MINIMUM_SUPPORTED: ${{ github.event_name == 'workflow_dispatch' && inputs.minimum_supported || 'false' }}
          MINIMUM_PANEL_API_VERSION: "1"
          MINIMUM_AGENT_CONTRACT_VERSION: "1"
        run: |
          python scripts/build-release-manifest.py \
            --input-dir release-input \
            --output-dir release-publish \
            --version "${RELEASE_VERSION#v}"
      - name: Опубликовать стабильный GitHub-релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${RELEASE_VERSION#v}"
          gh release create "$tag" release-publish/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nelomai ${RELEASE_VERSION#v}" \
            --notes "${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || format('Nelomai {0}', github.ref_name) }}"
