name: "release"
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build_and_publish — сборка с релизом; sign_candidate — только кандидат; publish_approved_candidate — готовый кандидат"
        type: "choice"
        options:
          - "build_only"
          - "sign_candidate"
          - "build_and_publish"
          - "publish_approved_candidate"
        default: "build_only"
        required: true
      source_sha:
        description: "Полный immutable source SHA; dispatch ref должен совпадать"
        type: "string"
        required: true
      version:
        description: "Проверяемая версия; исходники не переписываются"
        type: "string"
        default: "0.4.0"
        required: true
      candidate_run_id:
        description: "Номер успешной sign_candidate сборки; повторные попытки поддерживаются"
        type: "string"
      release_notes:
        description: "Обязательный changelog: короткие пункты на русском, каждый с - "
        type: "string"
        required: true
      critical:
        description: "Критическое обновление"
        type: "boolean"
        default: false
      minimum_supported:
        description: "Минимально поддерживаемая версия"
        type: "boolean"
        default: false
      panel_notification_ready:
        description: "Подтверждаю, что панель с producer уведомлений уже развёрнута"
        type: "boolean"
        required: true
        default: false
permissions:
  contents: "read"
  actions: "read"
defaults:
  run:
    shell: "bash"
env:
  SOURCE_SHA: "${{ inputs.source_sha }}"
  # The combined mode reuses the exact signed-candidate pipeline and inventory.
  # Publication overrides this with its existing, keyless promotion policy.
  RELEASE_MODE: "${{ inputs.mode == 'build_and_publish' && 'sign_candidate' || inputs.mode }}"
  RELEASE_VERSION: "${{ inputs.version }}"
  RELEASE_NOTES: "${{ inputs.release_notes }}"
  GH_TOKEN: "${{ github.token }}"
  NELOMAI_RELEASE_MANIFEST_PUBLIC_KEY_B64: "${{ vars.NELOMAI_RELEASE_MANIFEST_PUBLIC_KEY_B64 }}"
  NELOMAI_UPDATER_PUBLIC_KEY: "${{ secrets.NELOMAI_UPDATER_PUBLIC_KEY }}"
jobs:
  verify:
    if: "github.repository == 'NelomaiTTT/nelomai-app' && github.ref == 'refs/heads/Future/desktop-0.4.0' && github.event_name == 'workflow_dispatch' && github.sha == inputs.source_sha && (inputs.mode != 'publish_approved_candidate')"
    runs-on: "ubuntu-22.04"
    steps:
      -
        uses: "actions/checkout@v7.0.1"
        with:
          ref: "${{ inputs.source_sha }}"
          fetch-depth: 0
          submodules: "recursive"
          persist-credentials: false
      - name: "Exact desktop release source before local code"
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = NelomaiTTT/nelomai-app
          test "$GITHUB_REF" = refs/heads/Future/desktop-0.4.0
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          test "$RELEASE_VERSION" = 0.4.0
          python - <<'PY'
          import os
          lines = [line.strip() for line in os.environ["RELEASE_NOTES"].splitlines() if line.strip()]
          if not lines or any(not line.startswith("- ") or not line[2:].strip() for line in lines):
              raise SystemExit("release_notes: required nonempty bullet list (- пункт)")
          PY
      -
        uses: "./.github/actions/release-native-host"
        with:
          node24: "true"
          platform: "linux"
          target: "x86_64-unknown-linux-gnu"
          android-fixtures: "true"
      -
        name: "Exact source before generated inputs"
        run: |
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$RELEASE_VERSION" = 0.4.0
          python scripts/release-candidate-gates.py source --source-sha "$SOURCE_SHA" --version 0.4.0 --mode "$RELEASE_MODE"
      -
        name: "Pinned AmneziaWG source"
        run: |
          test "$(git -C vendor/amneziawg-go rev-parse HEAD)" = 08d68cdae27762c3e07f36bbb12d2bad32f81926
          test "$(cd vendor/amneziawg-android/tunnel/tools/libwg-go && go env GOWORK)" = "$GITHUB_WORKSPACE/go.work"
          test "$(cd vendor/amneziawg-android/tunnel/tools/libwg-go && go list -m -f '{{.Dir}}' github.com/amnezia-vpn/amneziawg-go/v3)" = "$GITHUB_WORKSPACE/vendor/amneziawg-go"
      -
        run: "npm test"
      -
        run: "python contracts/python/validate_fixtures.py"
      -
        run: "cargo build --locked -p nelomai-contracts --bin verify-runtime-manifest"
      -
        run: "cargo build --locked -p nelomai-client-updater --example verify-updater-signature"
      -
        run: "python scripts/release-workflow-check.py"
      -
        run: "cargo fmt --all --check"
      -
        run: "cargo clippy --workspace --all-targets -- -D warnings"
      -
        run: "cargo test --workspace --locked"
      -
        run: "python -m unittest discover -s scripts/tests"
  native_drafts:
    if: "github.repository == 'NelomaiTTT/nelomai-app' && github.ref == 'refs/heads/Future/desktop-0.4.0' && github.event_name == 'workflow_dispatch' && github.sha == inputs.source_sha && (inputs.mode != 'publish_approved_candidate')"
    strategy:
      fail-fast: false
      matrix:
        include:
          -
            platform: "linux"
            architecture: "x86_64"
            runner: "ubuntu-22.04"
            rust_target: "x86_64-unknown-linux-gnu"
          -
            platform: "windows"
            architecture: "x86_64"
            runner: "windows-latest"
            rust_target: "x86_64-pc-windows-msvc"
          -
            platform: "macos"
            architecture: "aarch64"
            runner: "macos-14"
            rust_target: "aarch64-apple-darwin"
    runs-on: "${{ matrix.runner }}"
    env:
      PLATFORM: "${{ matrix.platform }}"
      ARCHITECTURE: "${{ matrix.architecture }}"
    steps:
      -
        uses: "actions/checkout@v7.0.1"
        with:
          ref: "${{ inputs.source_sha }}"
          fetch-depth: 0
          submodules: "recursive"
          persist-credentials: false
      - name: "Exact desktop release source before local code"
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = NelomaiTTT/nelomai-app
          test "$GITHUB_REF" = refs/heads/Future/desktop-0.4.0
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          test "$RELEASE_VERSION" = 0.4.0
          python - <<'PY'
          import os
          lines = [line.strip() for line in os.environ["RELEASE_NOTES"].splitlines() if line.strip()]
          if not lines or any(not line.startswith("- ") or not line[2:].strip() for line in lines):
              raise SystemExit("release_notes: required nonempty bullet list (- пункт)")
          PY
      -
        uses: "./.github/actions/release-native-host"
        with:
          node24: "true"
          platform: "${{ matrix.platform }}"
          target: "${{ matrix.rust_target }}"
      -
        name: "Exact source before generated inputs"
        run: |
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$RELEASE_VERSION" = 0.4.0
          python scripts/release-candidate-gates.py source --source-sha "$SOURCE_SHA" --version 0.4.0 --mode "$RELEASE_MODE"
      -
        run: "python scripts/prepare-release-trust.py --mode \"$RELEASE_MODE\" --public-key \"$RUNNER_TEMP/runtime-public.raw\""
      -
        name: "Native final payloads; ephemeral draft signatures only"
        if: "matrix.platform != 'windows'"
        run: |
          python scripts/build-release-platform.py --mode "$RELEASE_MODE" --source-sha "$SOURCE_SHA" \
            --platform "$PLATFORM" --architecture "$ARCHITECTURE" --public-key "$RUNNER_TEMP/runtime-public.raw" \
            --output "$RUNNER_TEMP/draft/$PLATFORM" --work "$RUNNER_TEMP/native-work"
      -
        name: "Windows native final payloads; ephemeral draft signatures only"
        if: "matrix.platform == 'windows'"
        shell: "pwsh"
        run: |
          python scripts/build-release-platform.py --mode "$env:RELEASE_MODE" --source-sha "$env:SOURCE_SHA" `
            --platform "$env:PLATFORM" --architecture "$env:ARCHITECTURE" --public-key "$env:RUNNER_TEMP/runtime-public.raw" `
            --output "$env:RUNNER_TEMP/draft/$env:PLATFORM" --work "$env:RUNNER_TEMP/native-work"
      -
        uses: "actions/upload-artifact@v4"
        with:
          name: "draft-${{ matrix.platform }}"
          path: "${{ runner.temp }}/draft/"
          if-no-files-found: "error"
          overwrite: true
          retention-days: 14
  sign:
    if: "github.repository == 'NelomaiTTT/nelomai-app' && github.ref == 'refs/heads/Future/desktop-0.4.0' && github.event_name == 'workflow_dispatch' && github.sha == inputs.source_sha"
    needs:
      - "verify"
      - "native_drafts"
    environment: "release-candidate-signing"
    runs-on: "ubuntu-22.04"
    outputs:
      root_sha256: "${{ steps.sign.outputs.root_sha256 }}"
    steps:
      -
        uses: "actions/checkout@v7.0.1"
        with:
          ref: "${{ inputs.source_sha }}"
          fetch-depth: 0
          submodules: "recursive"
          persist-credentials: false
      - name: "Exact desktop release source before local code"
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = NelomaiTTT/nelomai-app
          test "$GITHUB_REF" = refs/heads/Future/desktop-0.4.0
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          test "$RELEASE_VERSION" = 0.4.0
          python - <<'PY'
          import os
          lines = [line.strip() for line in os.environ["RELEASE_NOTES"].splitlines() if line.strip()]
          if not lines or any(not line.startswith("- ") or not line[2:].strip() for line in lines):
              raise SystemExit("release_notes: required nonempty bullet list (- пункт)")
          PY
      -
        uses: "./.github/actions/release-native-host"
        with:
          node24: "true"
          purpose: "signing"
          platform: "linux"
          target: "x86_64-unknown-linux-gnu"
      -
        name: "Exact source before generated inputs"
        run: |
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$RELEASE_VERSION" = 0.4.0
          python scripts/release-candidate-gates.py source --source-sha "$SOURCE_SHA" --version 0.4.0 --mode "$RELEASE_MODE"
      -
        uses: "actions/download-artifact@v4"
        with:
          pattern: "draft-*"
          merge-multiple: true
          path: "drafts"
      -
        name: "Phase-local trust"
        run: "python scripts/prepare-release-trust.py --mode \"$RELEASE_MODE\" --phase signing --public-key \"$RUNNER_TEMP/runtime-public.raw\" --private-key \"$RUNNER_TEMP/runtime-private.raw\""
        env:
          NELOMAI_RELEASE_MANIFEST_PRIVATE_KEY_B64: "${{ (inputs.mode == 'sign_candidate' || inputs.mode == 'build_and_publish') && secrets.NELOMAI_RELEASE_MANIFEST_PRIVATE_KEY_B64 || '' }}"
      -
        run: "cargo build --locked -p nelomai-contracts --bin verify-runtime-manifest"
      -
        name: "Final runtime/root/container documents via build-runtime-release-set.py"
        run: |
          python scripts/prepare-release-trust.py --mode sign_candidate --public-key "$RUNNER_TEMP/stable-public.raw"
          python scripts/download-confirmed-stable.py --output "$RUNNER_TEMP/confirmed-stable" --public-key "$RUNNER_TEMP/stable-public.raw"
          root_sha=$(python scripts/sign-runtime-candidate.py --mode "$RELEASE_MODE" --source-sha "$SOURCE_SHA" \
            --version "$RELEASE_VERSION" --confirmed-stable "$RUNNER_TEMP/confirmed-stable" --stable-public-key "$RUNNER_TEMP/stable-public.raw" \
            --drafts drafts --output signed --signing-key "$RUNNER_TEMP/runtime-private.raw" --public-key "$RUNNER_TEMP/runtime-public.raw")
          echo "root_sha256=$root_sha" >> "$GITHUB_OUTPUT"
        id: "sign"
      -
        uses: "actions/upload-artifact@v4"
        with:
          name: "signed-runtime"
          path: "signed/"
          if-no-files-found: "error"
          overwrite: true
          retention-days: 14
  native_packages:
    if: "github.repository == 'NelomaiTTT/nelomai-app' && github.ref == 'refs/heads/Future/desktop-0.4.0' && github.event_name == 'workflow_dispatch' && github.sha == inputs.source_sha"
    needs:
      - "native_drafts"
      - "sign"
    strategy:
      fail-fast: false
      matrix:
        include:
          -
            platform: "linux"
            architecture: "x86_64"
            runner: "ubuntu-22.04"
            rust_target: "x86_64-unknown-linux-gnu"
          -
            platform: "windows"
            architecture: "x86_64"
            runner: "windows-2022"
            rust_target: "x86_64-pc-windows-msvc"
          -
            platform: "macos"
            architecture: "aarch64"
            runner: "macos-14"
            rust_target: "aarch64-apple-darwin"
    runs-on: "${{ matrix.runner }}"
    env:
      ROOT_SHA256: "${{ needs.sign.outputs.root_sha256 }}"
      PLATFORM: "${{ matrix.platform }}"
      ARCHITECTURE: "${{ matrix.architecture }}"
    steps:
      -
        uses: "actions/checkout@v7.0.1"
        with:
          ref: "${{ inputs.source_sha }}"
          fetch-depth: 0
          submodules: "recursive"
          persist-credentials: false
      - name: "Exact desktop release source before local code"
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = NelomaiTTT/nelomai-app
          test "$GITHUB_REF" = refs/heads/Future/desktop-0.4.0
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          test "$RELEASE_VERSION" = 0.4.0
          python - <<'PY'
          import os
          lines = [line.strip() for line in os.environ["RELEASE_NOTES"].splitlines() if line.strip()]
          if not lines or any(not line.startswith("- ") or not line[2:].strip() for line in lines):
              raise SystemExit("release_notes: required nonempty bullet list (- пункт)")
          PY
      -
        uses: "./.github/actions/release-native-host"
        with:
          node24: "true"
          purpose: "packaging"
          platform: "${{ matrix.platform }}"
          target: "${{ matrix.rust_target }}"
      -
        name: "Exact source before generated inputs"
        run: |
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$RELEASE_VERSION" = 0.4.0
          python scripts/release-candidate-gates.py source --source-sha "$SOURCE_SHA" --version 0.4.0 --mode "$RELEASE_MODE"
      -
        run: "python scripts/prepare-release-trust.py --mode \"$RELEASE_MODE\" --public-key \"$RUNNER_TEMP/runtime-public.raw\""
      -
        uses: "actions/download-artifact@v4"
        with:
          name: "signed-runtime"
          path: "signed"
      -
        uses: "actions/download-artifact@v4"
        if: "matrix.platform != 'windows'"
        with:
          name: "draft-${{ matrix.platform }}"
          path: "draft"
      -
        name: "Keyless native packaging and exact re-extraction"
        if: "matrix.platform != 'windows'"
        run: |
          python scripts/package-release-platform.py --mode "$RELEASE_MODE" --source-sha "$SOURCE_SHA" \
            --release-set-sha256 "$ROOT_SHA256" --platform "$PLATFORM" --architecture "$ARCHITECTURE" \
            --signed signed --draft "draft/$PLATFORM" --public-key "$RUNNER_TEMP/runtime-public.raw" \
            --output "packages/$PLATFORM"
      -
        name: "Windows keyless native packaging and exact re-extraction"
        if: "matrix.platform == 'windows'"
        shell: "pwsh"
        run: |
          python scripts/package-release-platform.py --mode "$env:RELEASE_MODE" --source-sha "$env:SOURCE_SHA" `
            --release-set-sha256 "$env:ROOT_SHA256" --platform "$env:PLATFORM" --architecture "$env:ARCHITECTURE" `
            --signed signed --draft "draft/$env:PLATFORM" --public-key "$env:RUNNER_TEMP/runtime-public.raw" `
            --output "packages/$env:PLATFORM"
      -
        uses: "actions/upload-artifact@v4"
        with:
          name: "packages-${{ matrix.platform }}"
          path: |
            packages/${{ matrix.platform }}/shipping/
            packages/${{ matrix.platform }}/package-digests.json
          if-no-files-found: "error"
          overwrite: true
          retention-days: 14
  macos_common_sign:
    if: "github.repository == 'NelomaiTTT/nelomai-app' && github.ref == 'refs/heads/Future/desktop-0.4.0' && github.event_name == 'workflow_dispatch' && github.sha == inputs.source_sha && (inputs.mode != 'publish_approved_candidate')"
    needs:
      - "native_packages"
      - "sign"
    environment: "release-candidate-finalization"
    runs-on: "macos-14"
    env:
      ROOT_SHA256: "${{ needs.sign.outputs.root_sha256 }}"
      NELOMAI_MACOS_SIGNER_SHA1: "${{ vars.NELOMAI_MACOS_SIGNER_SHA1 }}"
    steps:
      - uses: "actions/checkout@v7.0.1"
        with:
          ref: "${{ inputs.source_sha }}"
          fetch-depth: 0
          persist-credentials: false
      - name: "Exact desktop release source before local code"
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = NelomaiTTT/nelomai-app
          test "$GITHUB_REF" = refs/heads/Future/desktop-0.4.0
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          test "$RELEASE_VERSION" = 0.4.0
          python - <<'PY'
          import os
          lines = [line.strip() for line in os.environ["RELEASE_NOTES"].splitlines() if line.strip()]
          if not lines or any(not line.startswith("- ") or not line[2:].strip() for line in lines):
              raise SystemExit("release_notes: required nonempty bullet list (- пункт)")
          PY
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.12"
      - name: Bootstrap Python trust after emSign incident
        shell: bash
        run: |
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install "certifi==2026.10.19"
      - name: "Exact source before common signing"
        run: |
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: "actions/download-artifact@v4"
        with:
          name: "packages-macos"
          path: "unsigned-macos"
      - name: "Sign outer macOS common without rebuilding runtimes"
        run: |
          python scripts/sign-macos-common-package.py --mode "$RELEASE_MODE" --source-sha "$SOURCE_SHA" \
            --release-set-sha256 "$ROOT_SHA256" --input unsigned-macos --output signed-common-macos \
            --work "$RUNNER_TEMP/common-signing" --certificate-sha1 "$NELOMAI_MACOS_SIGNER_SHA1"
        env:
          NELOMAI_MACOS_SIGNING_P12_BASE64: "${{ (inputs.mode == 'sign_candidate' || inputs.mode == 'build_and_publish') && secrets.NELOMAI_MACOS_SIGNING_P12_BASE64 || '' }}"
          NELOMAI_MACOS_SIGNING_P12_PASSWORD: "${{ (inputs.mode == 'sign_candidate' || inputs.mode == 'build_and_publish') && secrets.NELOMAI_MACOS_SIGNING_P12_PASSWORD || '' }}"
      - uses: "actions/upload-artifact@v4"
        with:
          name: "signed-common-macos"
          path: "signed-common-macos/"
          if-no-files-found: "error"
          overwrite: true
          retention-days: 14
  finalize:
    if: "github.repository == 'NelomaiTTT/nelomai-app' && github.ref == 'refs/heads/Future/desktop-0.4.0' && github.event_name == 'workflow_dispatch' && github.sha == inputs.source_sha"
    needs:
      - "native_packages"
      - "sign"
      - "macos_common_sign"
    environment: "release-candidate-finalization"
    runs-on: "ubuntu-22.04"
    env:
      ROOT_SHA256: "${{ needs.sign.outputs.root_sha256 }}"
      RELEASE_NOTES: "${{ inputs.release_notes }}"
      RELEASE_CRITICAL: "${{ inputs.critical }}"
      RELEASE_MINIMUM_SUPPORTED: "${{ inputs.minimum_supported }}"
      NELOMAI_MACOS_SIGNER_SHA1: "${{ vars.NELOMAI_MACOS_SIGNER_SHA1 }}"
    outputs:
      inventory_sha256: "${{ steps.final.outputs.inventory_sha256 }}"
      artifact_id: "${{ steps.candidate.outputs.artifact-id }}"
    steps:
      -
        uses: "actions/checkout@v7.0.1"
        with:
          ref: "${{ inputs.source_sha }}"
          fetch-depth: 0
          submodules: "recursive"
          persist-credentials: false
      - name: "Exact desktop release source before local code"
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = NelomaiTTT/nelomai-app
          test "$GITHUB_REF" = refs/heads/Future/desktop-0.4.0
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          test "$RELEASE_VERSION" = 0.4.0
          python - <<'PY'
          import os
          lines = [line.strip() for line in os.environ["RELEASE_NOTES"].splitlines() if line.strip()]
          if not lines or any(not line.startswith("- ") or not line[2:].strip() for line in lines):
              raise SystemExit("release_notes: required nonempty bullet list (- пункт)")
          PY
      -
        uses: "./.github/actions/release-native-host"
        with:
          node24: "true"
          purpose: "finalization"
          platform: "linux"
          target: "x86_64-unknown-linux-gnu"
      -
        name: "Exact source before generated inputs"
        run: |
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$RELEASE_VERSION" = 0.4.0
          python scripts/release-candidate-gates.py source --source-sha "$SOURCE_SHA" --version 0.4.0 --mode "$RELEASE_MODE"
      -
        uses: "actions/download-artifact@v4"
        with:
          name: "signed-runtime"
          path: "signed"
      -
        uses: "actions/download-artifact@v4"
        with:
          pattern: "packages-*"
          path: "package-downloads"
      -
        name: "Keep platform and purpose separation"
        run: |
          mkdir packages
          for platform in linux windows; do mv "package-downloads/packages-$platform" "packages/$platform"; done
      - uses: "actions/download-artifact@v4"
        with:
          name: "signed-common-macos"
          path: "packages/macos"
      -
        name: "Phase-local trust"
        run: "python scripts/prepare-release-trust.py --mode \"$RELEASE_MODE\" --phase finalization --public-key \"$RUNNER_TEMP/runtime-public.raw\" --private-key \"$RUNNER_TEMP/runtime-private.raw\""
        env:
          NELOMAI_RELEASE_MANIFEST_PRIVATE_KEY_B64: "${{ (inputs.mode == 'sign_candidate' || inputs.mode == 'build_and_publish') && secrets.NELOMAI_RELEASE_MANIFEST_PRIVATE_KEY_B64 || '' }}"
      -
        run: "cargo build --locked -p nelomai-contracts --bin verify-runtime-manifest"
      -
        run: "cargo build --locked -p nelomai-client-updater --example verify-updater-signature"
      -
        name: "Final shipping installer/updater signatures"
        run: |
          python scripts/finalize-release-candidate.py --mode "$RELEASE_MODE" --source-sha "$SOURCE_SHA" \
            --release-set-sha256 "$ROOT_SHA256" --packages packages --signed signed --output finalized \
            --public-key "$RUNNER_TEMP/runtime-public.raw" --private-key "$RUNNER_TEMP/runtime-private.raw" \
            --work "$RUNNER_TEMP/finalization" > final-result.json
          python -c 'import json,os; d=json.load(open("final-result.json")); f=open(os.environ["GITHUB_OUTPUT"],"a"); f.write("inventory_sha256="+d["inventory_sha256"]+"\n")'
        id: "final"
        env:
          TAURI_SIGNING_PRIVATE_KEY: "${{ (inputs.mode == 'sign_candidate' || inputs.mode == 'build_and_publish') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: "${{ (inputs.mode == 'sign_candidate' || inputs.mode == 'build_and_publish') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}"
      -
        uses: "actions/upload-artifact@v4"
        id: "candidate"
        with:
          name: "candidate-0.4.0"
          path: "finalized/candidate/"
          if-no-files-found: "error"
          overwrite: true
          retention-days: 14
  publish:
    needs:
      - "finalize"
    # Standalone promotion has skipped build dependencies; inline promotion
    # must fail closed unless finalization (including artifact upload) succeeded.
    if: "github.repository == 'NelomaiTTT/nelomai-app' && github.ref == 'refs/heads/Future/desktop-0.4.0' && github.event_name == 'workflow_dispatch' && github.sha == inputs.source_sha && (always() && !cancelled() && (inputs.mode == 'publish_approved_candidate' || (inputs.mode == 'build_and_publish' && needs.finalize.result == 'success')))"
    environment: "release-publication"
    permissions:
      contents: "write"
      actions: "read"
    runs-on: "ubuntu-22.04"
    env:
      RELEASE_MODE: "publish_approved_candidate"
      CANDIDATE_RUN: "${{ inputs.mode == 'build_and_publish' && github.run_id || inputs.candidate_run_id }}"
      INVENTORY_SHA256: "${{ needs.finalize.outputs.inventory_sha256 }}"
      FINALIZED_ARTIFACT_ID: "${{ needs.finalize.outputs.artifact_id }}"
      RELEASE_NOTES: "${{ inputs.release_notes }}"
    steps:
      -
        uses: "actions/checkout@v7.0.1"
        with:
          ref: "${{ inputs.source_sha }}"
          fetch-depth: 0
          submodules: "recursive"
          persist-credentials: false
      - name: "Exact desktop release source before local code"
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = NelomaiTTT/nelomai-app
          test "$GITHUB_REF" = refs/heads/Future/desktop-0.4.0
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          test "$RELEASE_VERSION" = 0.4.0
          python - <<'PY'
          import os
          lines = [line.strip() for line in os.environ["RELEASE_NOTES"].splitlines() if line.strip()]
          if not lines or any(not line.startswith("- ") or not line[2:].strip() for line in lines):
              raise SystemExit("release_notes: required nonempty bullet list (- пункт)")
          PY
      -
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.12"
      - name: Bootstrap Python trust after emSign incident
        shell: bash
        run: |
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install "certifi==2026.10.19"
      -
        run: "python -m pip install 'cryptography>=45,<46'"
      -
        name: "Exact source before generated inputs"
        run: |
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$RELEASE_VERSION" = 0.4.0
          python scripts/release-candidate-gates.py source --source-sha "$SOURCE_SHA" --version 0.4.0 --mode "$RELEASE_MODE"
      -
        run: "python scripts/prepare-release-trust.py --mode \"$RELEASE_MODE\" --public-key \"$RUNNER_TEMP/runtime-public.raw\""
      -
        run: "python -c 'import os,pathlib; p=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"updater-public.b64\"; p.write_text(os.environ[\"NELOMAI_UPDATER_PUBLIC_KEY\"])'"
      -
        name: "Проверить готовность панели к уведомлению"
        run: |
          echo "Сначала разверните и проверьте panel notification producer" >&2
          exit 1
        if: "inputs.panel_notification_ready != true"
      - name: "Select retained shipping build"
        if: "inputs.mode == 'publish_approved_candidate'"
        id: "select"
        run: |
          python scripts/check-publication-inputs.py --select --repository "$GITHUB_REPOSITORY" \
            --run-id "$CANDIDATE_RUN" --source-sha "$SOURCE_SHA" --version "$RELEASE_VERSION"
      - name: "Require finalized outputs for inline publication"
        if: "inputs.mode == 'build_and_publish'"
        run: |
          test -n "$FINALIZED_ARTIFACT_ID"
          test -n "$INVENTORY_SHA256"
      - uses: "actions/download-artifact@v4"
        with:
          artifact-ids: "${{ inputs.mode == 'build_and_publish' && needs.finalize.outputs.artifact_id || steps.select.outputs.artifact_id }}"
          path: "candidate"
          run-id: "${{ env.CANDIDATE_RUN }}"
          merge-multiple: true
          github-token: "${{ github.token }}"
      -
        name: "Publish verified candidate without rebuilding"
        run: |
          python scripts/check-publication-inputs.py --directory candidate --source-sha "$SOURCE_SHA" \
            --run-id "$CANDIDATE_RUN" --inventory-sha256 "$INVENTORY_SHA256"
          python scripts/release-candidate-gates.py tag --repository "$GITHUB_REPOSITORY" --version 0.4.0 --source-sha "$SOURCE_SHA"
          mapfile -t assets < <(python -c 'import importlib.util; s=importlib.util.spec_from_file_location("g","scripts/release-candidate-gates.py"); g=importlib.util.module_from_spec(s); s.loader.exec_module(g); print("\n".join("candidate/"+n for n in sorted(g.PUBLISH_ASSETS)))')
          test "${#assets[@]}" -eq 16
          gh release create v0.4.0 "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "Nelomai 0.4.0" --notes "$RELEASE_NOTES"
