        run: if command -v rustup >/dev/null; then if brew list --versions rustup >/dev/null 2>&1; then brew update; brew upgrade rustup; echo "$(brew --prefix rustup)/bin" >> "$GITHUB_PATH"; else rustup self update; fi; fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: aarch64-apple-darwin
          components: rustfmt, clippy
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Exact keyless source and public verifiers
        run: |
          python scripts/macos-candidate.py source --source-sha "$SOURCE_SHA" --keyless
          cargo build --locked -p nelomai-contracts --bin verify-runtime-manifest
          python scripts/prepare-release-trust.py --mode sign_candidate --public-key "$RUN_ROOT/runtime-public.raw"
      - uses: actions/download-artifact@v4
        with:
          name: macos-candidate-signed-runtime
          path: ${{ env.RUN_ROOT }}/signed
      - name: Package macOS app and verify its extracted signed bytes
        run: |
          python scripts/macos-candidate.py package --source-sha "$SOURCE_SHA" \
            --signed "$RUN_ROOT/signed" --output "$RUN_ROOT/packages" \
            --public-key "$RUN_ROOT/runtime-public.raw" --stable-public-key "$RUN_ROOT/runtime-public.raw"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-candidate-package
          path: |
            ${{ env.RUN_ROOT }}/packages/shipping/
            ${{ env.RUN_ROOT }}/packages/package-digests.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove native packaging work
        if: always()
        run: |
          if [[ -n "${RUN_ROOT:-}" && "$RUN_ROOT" == "$RUNNER_TEMP"/macos-candidate.* ]]; then rm -rf -- "$RUN_ROOT"; fi

  common_sign:
    needs: package
    if: >-
      github.repository == 'NelomaiTTT/nelomai-app' &&
      github.ref == 'refs/heads/Future/desktop-0.4.0' &&
      github.event_name == 'workflow_dispatch' && github.sha == inputs.source_sha
    environment: release-candidate-finalization
    runs-on: macos-15
    timeout-minutes: 30
    env:
      NELOMAI_MACOS_SIGNER_SHA1: ${{ vars.NELOMAI_MACOS_SIGNER_SHA1 }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Exact source and keyless host before local code
        id: guard
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = NelomaiTTT/nelomai-app
          test "$GITHUB_REF" = refs/heads/Future/desktop-0.4.0
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse refs/remotes/origin/Future/desktop-0.4.0)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          for name in NELOMAI_RELEASE_MANIFEST_PRIVATE_KEY_B64 TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD ANDROID_KEYSTORE_PATH ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD NELOMAI_MACOS_SIGNING_P12_BASE64 NELOMAI_MACOS_SIGNING_P12_PASSWORD APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_API_KEY APPLE_API_KEY_PATH; do
            test -z "${!name:-}"
          done
          echo "RUN_ROOT=$(mktemp -d "$RUNNER_TEMP/macos-candidate.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Common signature regressions before private identity
        run: python -m unittest scripts.tests.test_macos_common_signing
      - uses: actions/download-artifact@v4
        with:
          name: macos-candidate-package
          path: ${{ env.RUN_ROOT }}/packages
      - name: Sign only the outer common with the persistent identity
        env:
          NELOMAI_MACOS_SIGNING_P12_BASE64: ${{ secrets.NELOMAI_MACOS_SIGNING_P12_BASE64 }}
          NELOMAI_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.NELOMAI_MACOS_SIGNING_P12_PASSWORD }}
        run: |
          STABLE_ROOT_SHA256=$(python -c 'import runpy; print(runpy.run_path("scripts/release-candidate-gates.py")["STABLE_ROOT_SHA256"])')
          python scripts/sign-macos-common-package.py --mode sign_candidate --source-sha "$SOURCE_SHA" \
            --release-set-sha256 "$STABLE_ROOT_SHA256" --input "$RUN_ROOT/packages" --output "$RUN_ROOT/common-signed" \
            --work "$RUN_ROOT/common-work" --certificate-sha1 "$NELOMAI_MACOS_SIGNER_SHA1"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-candidate-common-signed
          path: ${{ env.RUN_ROOT }}/common-signed/
          if-no-files-found: error
          retention-days: 7
      - name: Remove protected common signing work
        if: always()
        run: |
          if [[ -n "${RUN_ROOT:-}" && "$RUN_ROOT" == "$RUNNER_TEMP"/macos-candidate.* ]]; then rm -rf -- "$RUN_ROOT"; fi

  finalize:
    needs: common_sign
    if: >-
      github.repository == 'NelomaiTTT/nelomai-app' &&
      github.ref == 'refs/heads/Future/desktop-0.4.0' &&
      github.event_name == 'workflow_dispatch' && github.sha == inputs.source_sha
    environment: release-candidate-finalization
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      NELOMAI_MACOS_SIGNER_SHA1: ${{ vars.NELOMAI_MACOS_SIGNER_SHA1 }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Exact source and keyless host before local code
        id: guard
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = NelomaiTTT/nelomai-app
          test "$GITHUB_REF" = refs/heads/Future/desktop-0.4.0
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse refs/remotes/origin/Future/desktop-0.4.0)" = "$SOURCE_SHA"
