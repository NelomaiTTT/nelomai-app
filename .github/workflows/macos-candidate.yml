        with:
          purpose: signing
          platform: linux
          target: x86_64-unknown-linux-gnu
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Source and package security tests before updater private key
        run: |
          npm ci
          python scripts/macos-candidate.py source --source-sha "$SOURCE_SHA" --keyless
          cargo build --locked -p nelomai-contracts --bin verify-runtime-manifest
          cargo build --locked -p nelomai-client-updater --example verify-updater-signature
          python -m unittest scripts.tests.test_macos_candidate scripts.tests.test_runtime_artifact scripts.tests.test_macos_common_signing
          python scripts/prepare-release-trust.py --mode sign_candidate --public-key "$RUN_ROOT/runtime-public.raw"
      - uses: actions/download-artifact@v4
        with:
          name: macos-candidate-signed-runtime
          path: ${{ env.RUN_ROOT }}/signed
      - uses: actions/download-artifact@v4
        with:
          name: macos-candidate-common-signed
          path: ${{ env.RUN_ROOT }}/packages
      - name: Sign unchanged macOS archive and independently verify updater signature
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          python scripts/macos-candidate.py finalize --source-sha "$SOURCE_SHA" \
            --packages "$RUN_ROOT/packages" --signed "$RUN_ROOT/signed" --output "$RUN_ROOT/candidate" \
            --public-key "$RUN_ROOT/runtime-public.raw" --stable-public-key "$RUN_ROOT/runtime-public.raw"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-test-candidate-${{ env.SOURCE_SHA }}
          path: ${{ env.RUN_ROOT }}/candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Remove protected finalization work
        if: always()
        run: |
          if [[ -n "${RUN_ROOT:-}" && "$RUN_ROOT" == "$RUNNER_TEMP"/macos-candidate.* ]]; then rm -rf -- "$RUN_ROOT"; fi
