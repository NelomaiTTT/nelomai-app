name: macOS signed test candidate

on:
  # Registers this branch workflow without building; dispatch after its exact-SHA
  # macOS development run is green on the single dedicated local VM.
  push:
    branches: [Future/desktop-0.4.0]
    paths:
      - .github/workflows/macos-candidate.yml
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-hex HEAD of Future/desktop-0.4.0; nonpublishable macOS 0.4.0 candidate
        type: string
        required: true

concurrency:
  group: macos-candidate-local-vm
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  GH_TOKEN: ${{ github.token }}
  NELOMAI_RELEASE_MANIFEST_PUBLIC_KEY_B64: ${{ vars.NELOMAI_RELEASE_MANIFEST_PUBLIC_KEY_B64 }}
  NELOMAI_UPDATER_PUBLIC_KEY: ${{ secrets.NELOMAI_UPDATER_PUBLIC_KEY }}

jobs:
  build:
    if: >-
      github.repository == 'NelomaiTTT/nelomai-app' &&
      github.ref == 'refs/heads/Future/desktop-0.4.0' &&
      github.event_name == 'workflow_dispatch' && github.sha == inputs.source_sha
    runs-on: [self-hosted, macOS, ARM64, nelomai-040-macos-vm]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Exact source and keyless host before local code
        id: guard
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = NelomaiTTT/nelomai-app
          test "$GITHUB_REF" = refs/heads/Future/desktop-0.4.0
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse refs/remotes/origin/Future/desktop-0.4.0)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          for name in NELOMAI_RELEASE_MANIFEST_PRIVATE_KEY_B64 TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD ANDROID_KEYSTORE_PATH ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD NELOMAI_MACOS_SIGNING_P12_BASE64 NELOMAI_MACOS_SIGNING_P12_PASSWORD APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_API_KEY APPLE_API_KEY_PATH; do
            test -z "${!name:-}"
          done
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(id -u)" != 0
          echo "RUN_ROOT=$(mktemp -d "$RUNNER_TEMP/macos-candidate.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap Python trust after emSign incident
        run: |
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install "certifi==2026.10.19" 'cryptography>=45,<46' 'PyYAML>=6,<7' 'packaging>=24,<27'
      - name: Update Rustup trust before toolchain downloads
        run: if command -v rustup >/dev/null; then if brew list --versions rustup >/dev/null 2>&1; then brew update; brew upgrade rustup; echo "$(brew --prefix rustup)/bin" >> "$GITHUB_PATH"; else rustup self update; fi; fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: aarch64-apple-darwin
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Exact source and native workspace before candidate build
        run: |
          python scripts/macos-candidate.py source --source-sha "$SOURCE_SHA" --keyless
          cargo fmt --all --check
          cargo test --locked --target aarch64-apple-darwin -p nelomai-unix-service -p nelomai-contracts -p nelomai-client-tunnel -p nelomai-client-core -p nelomai-client-application
          cargo build --locked -p nelomai-contracts --bin verify-runtime-manifest
          cargo build --locked -p nelomai-client-updater --example verify-updater-signature
          python -m unittest scripts.tests.test_macos_candidate scripts.tests.test_macos_common_signing
      - name: Build macOS latest inside the dedicated local VM with production public pins only
        run: |
          python scripts/prepare-release-trust.py --mode sign_candidate --public-key "$RUN_ROOT/runtime-public.raw"
          python scripts/build-release-platform.py --mode sign_candidate --source-sha "$SOURCE_SHA" \
            --platform macos --architecture aarch64 --public-key "$RUN_ROOT/runtime-public.raw" \
            --output "$RUN_ROOT/draft" --work "$RUN_ROOT/native-work"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-candidate-draft
          path: |
            ${{ env.RUN_ROOT }}/draft/latest/
            ${{ env.RUN_ROOT }}/draft/draft-public-key.raw
            ${{ env.RUN_ROOT }}/draft/runtime-public-key.raw
            ${{ env.RUN_ROOT }}/draft/macos-aarch64.sizes.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove native draft test keys and work
        if: always()
        run: |
          if [[ -n "${RUN_ROOT:-}" && "$RUN_ROOT" == "$RUNNER_TEMP"/macos-candidate.* ]]; then rm -rf -- "$RUN_ROOT"; fi

  sign:
    needs: build
    if: >-
      github.repository == 'NelomaiTTT/nelomai-app' &&
      github.ref == 'refs/heads/Future/desktop-0.4.0' &&
      github.event_name == 'workflow_dispatch' && github.sha == inputs.source_sha
    environment: release-candidate-signing
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Exact source and keyless host before local code
        id: guard
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = NelomaiTTT/nelomai-app
          test "$GITHUB_REF" = refs/heads/Future/desktop-0.4.0
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse refs/remotes/origin/Future/desktop-0.4.0)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          for name in NELOMAI_RELEASE_MANIFEST_PRIVATE_KEY_B64 TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD ANDROID_KEYSTORE_PATH ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD NELOMAI_MACOS_SIGNING_P12_BASE64 NELOMAI_MACOS_SIGNING_P12_PASSWORD APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_API_KEY APPLE_API_KEY_PATH; do
            test -z "${!name:-}"
          done
          echo "RUN_ROOT=$(mktemp -d "$RUNNER_TEMP/macos-candidate.XXXXXX")" >> "$GITHUB_ENV"
      - uses: ./.github/actions/release-native-host
        with:
          purpose: signing
          platform: linux
          target: x86_64-unknown-linux-gnu
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Source and crypto security tests before private keys
        run: |
          npm ci
          python scripts/macos-candidate.py source --source-sha "$SOURCE_SHA" --keyless
          cargo build --locked -p nelomai-contracts --bin verify-runtime-manifest
          cargo build --locked -p nelomai-client-updater --example verify-updater-signature
          python -m unittest scripts.tests.test_macos_candidate scripts.tests.test_runtime_artifact scripts.tests.test_macos_common_signing
          python scripts/prepare-release-trust.py --mode sign_candidate --public-key "$RUN_ROOT/runtime-public.raw"
      - uses: actions/download-artifact@v4
        with:
          name: macos-candidate-draft
          path: ${{ env.RUN_ROOT }}/draft
      - name: Authenticate only pinned stable macOS membership
        run: |
          python scripts/macos-candidate.py stable --source-sha "$SOURCE_SHA" \
            --public-key "$RUN_ROOT/runtime-public.raw" --output "$RUN_ROOT/stable"
      - name: Sign macOS latest and its two-slot container
        env:
          NELOMAI_RELEASE_MANIFEST_PRIVATE_KEY_B64: ${{ secrets.NELOMAI_RELEASE_MANIFEST_PRIVATE_KEY_B64 }}
        run: |
          trap 'rm -f "$RUN_ROOT/runtime-private.raw"' EXIT
          python scripts/prepare-release-trust.py --mode sign_candidate --phase signing \
            --public-key "$RUN_ROOT/signing-public.raw" --private-key "$RUN_ROOT/runtime-private.raw"
          python scripts/macos-candidate.py sign --source-sha "$SOURCE_SHA" \
            --draft "$RUN_ROOT/draft" --stable "$RUN_ROOT/stable" --output "$RUN_ROOT/signed" \
            --private-key "$RUN_ROOT/runtime-private.raw" --public-key "$RUN_ROOT/runtime-public.raw" \
            --stable-public-key "$RUN_ROOT/runtime-public.raw"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-candidate-signed-runtime
          path: ${{ env.RUN_ROOT }}/signed/
          if-no-files-found: error
          retention-days: 7
      - name: Remove protected signing work
        if: always()
        run: |
          if [[ -n "${RUN_ROOT:-}" && "$RUN_ROOT" == "$RUNNER_TEMP"/macos-candidate.* ]]; then rm -rf -- "$RUN_ROOT"; fi

  package:
    needs: sign
    if: >-
      github.repository == 'NelomaiTTT/nelomai-app' &&
      github.ref == 'refs/heads/Future/desktop-0.4.0' &&
      github.event_name == 'workflow_dispatch' && github.sha == inputs.source_sha
    runs-on: [self-hosted, macOS, ARM64, nelomai-040-macos-vm]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Exact source and keyless host before local code
        id: guard
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = NelomaiTTT/nelomai-app
          test "$GITHUB_REF" = refs/heads/Future/desktop-0.4.0
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse refs/remotes/origin/Future/desktop-0.4.0)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          for name in NELOMAI_RELEASE_MANIFEST_PRIVATE_KEY_B64 TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD ANDROID_KEYSTORE_PATH ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD NELOMAI_MACOS_SIGNING_P12_BASE64 NELOMAI_MACOS_SIGNING_P12_PASSWORD APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_API_KEY APPLE_API_KEY_PATH; do
            test -z "${!name:-}"
          done
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(id -u)" != 0
          echo "RUN_ROOT=$(mktemp -d "$RUNNER_TEMP/macos-candidate.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap Python trust after emSign incident
        run: |
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install "certifi==2026.10.19" 'cryptography>=45,<46' 'PyYAML>=6,<7' 'packaging>=24,<27'
