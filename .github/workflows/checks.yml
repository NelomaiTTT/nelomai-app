name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установить системные зависимости Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Установить Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;30.0.3" "build-tools;36.0.0"
      - name: Проверить Android tunnel plugin
        run: |
          chmod +x src-tauri/gen/android/gradlew
          tauri_manifest="$(
            cargo metadata --locked --format-version 1 |
              jq -r '.packages[] | select(.name == "tauri") | .manifest_path'
          )"
          test -n "$tauri_manifest"
          TAURI_ANDROID_PROJECT_DIR="$(dirname "$tauri_manifest")/mobile/android" \
            src-tauri/gen/android/gradlew \
            -p plugins/tunnel-android/android \
            testDebugUnitTest
      - name: Проверить Android push plugin
        run: |
          tauri_manifest="$(
            cargo metadata --locked --format-version 1 |
              jq -r '.packages[] | select(.name == "tauri") | .manifest_path'
          )"
          test -n "$tauri_manifest"
          TAURI_ANDROID_PROJECT_DIR="$(dirname "$tauri_manifest")/mobile/android" \
            src-tauri/gen/android/gradlew \
            -p plugins/push-android/android \
            testDebugUnitTest

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - run: cargo check -p nelomai-windows-service --all-targets
      - run: cargo check -p nelomai-app
      - run: cargo test -p nelomai-client-updater
      - run: cargo test -p nelomai-windows-service

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - run: cargo check -p nelomai-unix-service --all-targets
      - run: cargo check -p nelomai-app
      - run: cargo test -p nelomai-unix-service

  contracts-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "cryptography>=45,<46"
      - run: python contracts/python/validate_fixtures.py
      - run: python scripts/release-workflow-check.py
