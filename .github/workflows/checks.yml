name: checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  linux-package-diagnostic:
    if: github.event_name == 'workflow_dispatch'
    name: Linux test AppImage (not a release)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/release-native-host
        with:
          platform: linux
          target: x86_64-unknown-linux-gnu
      - name: Verify exact source and Linux regressions
        shell: bash
        run: |
          python scripts/release-candidate-gates.py source --source-sha "$SOURCE_SHA" --version 0.3.3 --mode build_only
          cargo fmt --all --check
          cargo test --locked -p nelomai-unix-service --lib
          cargo build --locked -p nelomai-contracts --bin verify-runtime-manifest
          python -m unittest scripts.tests.test_linux_test_package
      - name: Build fresh Linux runtime and helper with test trust
        shell: bash
        run: |
          python scripts/prepare-release-trust.py --mode build_only --phase signing \
            --public-key "$RUNNER_TEMP/runtime-public.raw" --private-key "$RUNNER_TEMP/runtime-private.raw"
          python scripts/build-release-platform.py --mode build_only --source-sha "$SOURCE_SHA" \
            --platform linux --architecture x86_64 --public-key "$RUNNER_TEMP/runtime-public.raw" \
            --output "$RUNNER_TEMP/draft" --work "$RUNNER_TEMP/native-work"
      - name: Package and re-extract Linux only
        shell: bash
        run: |
          python scripts/package-linux-test.py --source-sha "$SOURCE_SHA" \
            --draft "$RUNNER_TEMP/draft" --output "$RUNNER_TEMP/packages-linux" --work "$RUNNER_TEMP/package-work" \
            --public-key "$RUNNER_TEMP/runtime-public.raw" --private-key "$RUNNER_TEMP/runtime-private.raw"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: ${{ runner.temp }}/packages-linux/
          if-no-files-found: error
          retention-days: 14
  frontend:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  rust:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установить системные зависимости Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android-plugin:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
      - name: Проверить закреплённые исходники AmneziaWG
        run: |
          test "$(git -C vendor/amneziawg-android rev-parse HEAD)" = \
            f82900455f1aceaa85658686dc2c5e32c2c42a73
          test "$(git -C vendor/amneziawg-go rev-parse HEAD)" = \
            08d68cdae27762c3e07f36bbb12d2bad32f81926
          test "$(git -C vendor/amneziawg-android/tunnel/tools/amneziawg-tools rev-parse HEAD)" = \
            5d6179a6d0842e98dfb349c28cf1bd8e4b9d1079
          test "$(cd vendor/amneziawg-android/tunnel/tools/libwg-go && go env GOWORK)" = \
            "$GITHUB_WORKSPACE/go.work"
          test "$(cd vendor/amneziawg-android/tunnel/tools/libwg-go && \
            go list -m -f '{{.Dir}}' github.com/amnezia-vpn/amneziawg-go/v3)" = \
            "$GITHUB_WORKSPACE/vendor/amneziawg-go"
      - name: Установить Android SDK и NDK
        run: sdkmanager "platforms;android-36" "build-tools;30.0.3" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Проверить Rust-контейнер Android
        run: |
          ndk_bin="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$ndk_bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$ndk_bin/llvm-ar"
          cargo check --locked -p nelomai-android-container --target aarch64-linux-android
      - name: Проверить Android tunnel plugin
        run: |
          chmod +x src-tauri/gen/android/gradlew
          tauri_manifest="$(
            cargo metadata --locked --format-version 1 |
              jq -r '.packages[] | select(.name == "tauri") | .manifest_path'
          )"
          test -n "$tauri_manifest"
          TAURI_ANDROID_PROJECT_DIR="$(dirname "$tauri_manifest")/mobile/android" \
            src-tauri/gen/android/gradlew \
            -p plugins/tunnel-android/android \
            testDebugUnitTest \
            :amneziawg-tunnel:assembleDebug
          unzip -l \
            plugins/amneziawg-android-tunnel/build/outputs/aar/amneziawg-tunnel-debug.aar | \
            grep -q 'assets/licenses/AMNEZIAWG-TOOLS-GPL-2.0.txt'
          unzip -l \
            plugins/amneziawg-android-tunnel/build/outputs/aar/amneziawg-tunnel-debug.aar | \
            grep -q 'assets/licenses/ELF-CLEANER-GPL-2.0.txt'
          unzip -l \
            plugins/amneziawg-android-tunnel/build/outputs/aar/amneziawg-tunnel-debug.aar | \
            grep -q 'assets/licenses/AMNEZIAWG-GO-MIT.txt'
          unzip -l \
            plugins/amneziawg-android-tunnel/build/outputs/aar/amneziawg-tunnel-debug.aar | \
            grep -q 'assets/licenses/AMNEZIAWG-ANDROID-APACHE-2.0.txt'
          unzip -l \
            plugins/amneziawg-android-tunnel/build/outputs/aar/amneziawg-tunnel-debug.aar | \
            grep -q 'assets/licenses/SOURCE-OFFER.txt'
          unzip -l \
            plugins/amneziawg-android-tunnel/build/outputs/aar/amneziawg-tunnel-debug.aar | \
            grep -q 'jni/arm64-v8a/libwg-go.so'
          native_library="$RUNNER_TEMP/libwg-go.so"
          unzip -p \
            plugins/amneziawg-android-tunnel/build/outputs/aar/amneziawg-tunnel-debug.aar \
            jni/arm64-v8a/libwg-go.so > "$native_library"
          native_symbols="$RUNNER_TEMP/libwg-go.symbols"
          readelf --dyn-syms --wide "$native_library" > "$native_symbols"
          for symbol in \
            Java_org_amnezia_awg_GoBackend_awgGetNetworkTelemetry \
            Java_org_amnezia_awg_GoBackend_awgCloseUdp \
            Java_org_amnezia_awg_GoBackend_awgRebindUdp \
            Java_org_amnezia_awg_GoBackend_awgSendKeepalives \
            Java_org_amnezia_awg_GoBackend_awgStartHandshakeProbe \
            Java_org_amnezia_awg_GoBackend_awgHandshakeProbeStatus \
            Java_org_amnezia_awg_GoBackend_awgHandshakeProbeTimeoutMillis; do
            grep -Fq " $symbol" "$native_symbols"
          done
          if unzip -l plugins/amneziawg-android-tunnel/build/outputs/aar/amneziawg-tunnel-debug.aar | \
            grep -Eq 'jni/(armeabi-v7a|x86|x86_64)/'; then
            echo 'AWG AAR contains an unsupported Android ABI' >&2
            exit 1
          fi
      - name: Проверить Android push plugin
        run: |
          tauri_manifest="$(
            cargo metadata --locked --format-version 1 |
              jq -r '.packages[] | select(.name == "tauri") | .manifest_path'
          )"
          test -n "$tauri_manifest"
          TAURI_ANDROID_PROJECT_DIR="$(dirname "$tauri_manifest")/mobile/android" \
            src-tauri/gen/android/gradlew \
            -p plugins/push-android/android \
            testDebugUnitTest

  windows-build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    outputs:
      manifest_sha256: ${{ steps.artifact.outputs.manifest_sha256 }}
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - run: cargo check -p nelomai-windows-service --all-targets
      - run: cargo clippy --locked -p nelomai-windows-service --all-targets -- -D warnings
      - run: cargo check -p nelomai-app
      - run: cargo test -p nelomai-client-updater
      # The actual factory invokes the audited unimpersonated SYSTEM cooperative
      # lease. Run this one test separately under its real production principal;
      # its selector/coordinator/ownership/native gates are not replaced.
      - run: cargo test -p nelomai-windows-service -- --skip windows::member_carrier_factory::actual_execution::carrier_factory_selects_new_path_for_supported_pair
      # Read-only existing HKCU key. Log the actual native in/out-size contract;
      # this cannot grant SACL access, product key ownership or disposition.
      - name: Readonly original-key security buffer gate
        timeout-minutes: 2
        run: |
          $tests = & cargo test --locked -p nelomai-windows-service --lib native_security_buffer_sizes_readonly_descriptor_without_capacity_padding -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $selected = @($tests | Where-Object { $_ -match 'native_security_buffer_sizes_readonly_descriptor_without_capacity_padding: test$' })
          if ($selected.Count -ne 1) { throw 'Expected exactly one readonly security-size gate; no empty-filter PASS' }
          cargo test --locked -p nelomai-windows-service --lib native_security_buffer_sizes_readonly_descriptor_without_capacity_padding -- --nocapture --test-threads=1
      # Fresh ephemeral HKCU fixtures only. Explicit opt-in does NOT enable any
      # product deletion path or reuse historical unsafe ignored measurements.
      - name: Isolated original-handle TxR conflict gate
        timeout-minutes: 2
        run: |
          $tests = & cargo test --locked -p nelomai-windows-service --lib txr_transient_enlist_isolated_gate -- --ignored --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $selected = @($tests | Where-Object { $_ -match 'txr_transient_enlist_isolated_gate: test$' })
          if ($selected.Count -ne 1) { throw 'Expected exactly one isolated TxR gate; no empty-filter PASS' }
          cargo test --locked -p nelomai-windows-service --lib txr_transient_enlist_isolated_gate -- --ignored --nocapture --test-threads=1
      - name: Actual factory runtime input
        run: |
          # The installed engine is the exact shipping build. Keep the ordinary
          # test suite/debug assertions separate from the signed runtime fixture.
          cargo build --locked -p nelomai-windows-service --bin nelomai-windows-service --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $engine = (Resolve-Path -LiteralPath 'target/release/nelomai-windows-service.exe').Path
          Write-Output "Actual factory release engine bytes=$((Get-Item -LiteralPath $engine).Length)"
          $runtime = Join-Path $env:RUNNER_TEMP 'factory-runtime'
          # Reuse the pinned production dependency builder: SCM executes this
          # exact-source engine with genuine WG/AWG tunnel DLLs, never DATA.
          ./scripts/windows/prepare-runtime.ps1 -OutputDirectory $runtime -ServiceExecutable $engine
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $runtime 'wintun.dll')).Hash.ToLowerInvariant() -ne 'e5da8447dc2c320edc0fc52fa01885c103de8c118481f683643cacc3220dafce') {
            throw 'Audited factory Wintun input hash mismatch'
          }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $runtime 'wireguard.dll')).Hash.ToLowerInvariant() -ne 'b1b85e072c45d81358be29d94c599dc76652f912be8c0f0a41e2d5d89a6461d3') {
            throw 'Audited factory WireGuard DLL hash mismatch'
          }
          "NELOMAI_FACTORY_RUNTIME_DIRECTORY=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Assemble exact factory test artifact
        id: artifact
        env:
          ARTIFACT_NAME: windows-factory-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        run: |
          $build = @(& cargo test --release --locked -p nelomai-windows-service --lib --no-run --message-format=json)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests = @($build | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object {
            $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'nelomai_windows_service' -and $_.profile.test -and $_.executable
          })
          if ($tests.Count -ne 1) { throw 'Expected exactly one service library test executable' }
          python scripts/windows/carrier-factory-artifact.py create `
            --test-executable $tests[0].executable --runtime-directory $env:NELOMAI_FACTORY_RUNTIME_DIRECTORY `
            --output "$env:RUNNER_TEMP/factory-artifact" --source-sha $env:SOURCE_SHA --artifact-name $env:ARTIFACT_NAME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ runner.temp }}/factory-artifact/
          if-no-files-found: error
          retention-days: 1

  windows-native:
    if: github.event_name != 'workflow_dispatch'
    needs: [windows-build]
    name: windows-native (${{ matrix.case }})
    runs-on: windows-latest
    env:
      SOURCE_SHA: ${{ github.sha }}
      MANIFEST_SHA256: ${{ needs.windows-build.outputs.manifest_sha256 }}
      ARTIFACT_NAME: ${{ needs.windows-build.outputs.artifact_name }}
    strategy:
      fail-fast: false
      matrix:
        case:
          - primary
          - network-route-postflight
          - module-load-read-error
          - module-load-read-unwind
          - resolver-reference-error
          - resolver-reference-unwind
          - carrier-ack
          - carrier-unwind
          - member-ack
          - member-unwind
          - running-ack
          - running-unwind
          - cold
          - primary-data-denial
          - creator-ack
          - initial-native-ack
          - initial-native-unwind
          - fresh-ack
          - starting-ack
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - name: Require successful build artifact outputs
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ARTIFACT_NAME) -or $env:MANIFEST_SHA256 -notmatch '^[a-f0-9]{64}$') {
            throw 'Missing successful build artifact outputs; no fallback'
          }
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows-build.outputs.artifact_name }}
          path: ${{ runner.temp }}/factory-artifact/
      - name: Verify current-source factory artifact before execution
        run: |
          python scripts/windows/carrier-factory-artifact.py verify `
            --directory "$env:RUNNER_TEMP/factory-artifact" --source-sha $env:SOURCE_SHA --manifest-sha256 $env:MANIFEST_SHA256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # One fresh runner per case; retain the SAME unimpersonated SYSTEM harness
      # and its exact fault/completion counts. No build or previous-run fallback.
      - name: Actual factory lifecycle under SYSTEM
        timeout-minutes: 55
        run: |
          ./scripts/windows/test-carrier-factory-system.ps1 -TestExecutable "$env:RUNNER_TEMP/factory-artifact/factory-tests.exe" `
            -RuntimeDirectory "$env:RUNNER_TEMP/factory-artifact/runtime" `
            -OutputDirectory $env:RUNNER_TEMP -Case ${{ matrix.case }}

  windows:
    if: ${{ always() && github.event_name != 'workflow_dispatch' }}
    needs: [windows-build, windows-native]
    runs-on: ubuntu-latest
    steps:
      - name: Require common build and every isolated native factory case
        env:
          BUILD_RESULT: ${{ needs.windows-build.result }}
          NATIVE_RESULT: ${{ needs.windows-native.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$NATIVE_RESULT" = success

  macos:
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - run: cargo check -p nelomai-unix-service --all-targets
      - run: cargo check -p nelomai-app
      - run: cargo test -p nelomai-unix-service

  contracts-python:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "cryptography>=45,<46" "PyYAML>=6,<7"
      - name: Isolated contracts Rustup home
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/nelomai-contracts-rustup" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - run: cargo build --locked -p nelomai-contracts --bin verify-runtime-manifest
      - run: python contracts/python/validate_fixtures.py
      - run: python scripts/release-workflow-check.py
