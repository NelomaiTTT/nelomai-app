name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установить системные зависимости Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Проверить закреплённые исходники AmneziaWG
        run: |
          test "$(git -C vendor/amneziawg-android rev-parse HEAD)" = \
            f82900455f1aceaa85658686dc2c5e32c2c42a73
          test "$(git -C vendor/amneziawg-go rev-parse HEAD)" = \
            08d68cdae27762c3e07f36bbb12d2bad32f81926
          test "$(git -C vendor/amneziawg-android/tunnel/tools/amneziawg-tools rev-parse HEAD)" = \
            5d6179a6d0842e98dfb349c28cf1bd8e4b9d1079
          test "$(cd vendor/amneziawg-android/tunnel/tools/libwg-go && go env GOWORK)" = \
            "$GITHUB_WORKSPACE/go.work"
          test "$(cd vendor/amneziawg-android/tunnel/tools/libwg-go && \
            go list -m -f '{{.Dir}}' github.com/amnezia-vpn/amneziawg-go/v3)" = \
            "$GITHUB_WORKSPACE/vendor/amneziawg-go"
      - name: Установить Android SDK и NDK
        run: sdkmanager "platforms;android-36" "build-tools;30.0.3" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Проверить Android tunnel plugin
        run: |
          chmod +x src-tauri/gen/android/gradlew
          tauri_manifest="$(
            cargo metadata --locked --format-version 1 |
              jq -r '.packages[] | select(.name == "tauri") | .manifest_path'
          )"
          test -n "$tauri_manifest"
          TAURI_ANDROID_PROJECT_DIR="$(dirname "$tauri_manifest")/mobile/android" \
            src-tauri/gen/android/gradlew \
            -p plugins/tunnel-android/android \
            testDebugUnitTest \
            :amneziawg-tunnel:assembleDebug
          unzip -l \
            plugins/amneziawg-android-tunnel/build/outputs/aar/amneziawg-tunnel-debug.aar | \
            grep -q 'assets/licenses/AMNEZIAWG-TOOLS-GPL-2.0.txt'
          unzip -l \
            plugins/amneziawg-android-tunnel/build/outputs/aar/amneziawg-tunnel-debug.aar | \
            grep -q 'assets/licenses/ELF-CLEANER-GPL-2.0.txt'
          unzip -l \
            plugins/amneziawg-android-tunnel/build/outputs/aar/amneziawg-tunnel-debug.aar | \
            grep -q 'assets/licenses/AMNEZIAWG-GO-MIT.txt'
          unzip -l \
            plugins/amneziawg-android-tunnel/build/outputs/aar/amneziawg-tunnel-debug.aar | \
            grep -q 'assets/licenses/AMNEZIAWG-ANDROID-APACHE-2.0.txt'
          unzip -l \
            plugins/amneziawg-android-tunnel/build/outputs/aar/amneziawg-tunnel-debug.aar | \
            grep -q 'assets/licenses/SOURCE-OFFER.txt'
          unzip -l \
            plugins/amneziawg-android-tunnel/build/outputs/aar/amneziawg-tunnel-debug.aar | \
            grep -q 'jni/arm64-v8a/libwg-go.so'
          if unzip -l plugins/amneziawg-android-tunnel/build/outputs/aar/amneziawg-tunnel-debug.aar | \
            grep -Eq 'jni/(armeabi-v7a|x86|x86_64)/'; then
            echo 'AWG AAR contains an unsupported Android ABI' >&2
            exit 1
          fi
      - name: Проверить Android push plugin
        run: |
          tauri_manifest="$(
            cargo metadata --locked --format-version 1 |
              jq -r '.packages[] | select(.name == "tauri") | .manifest_path'
          )"
          test -n "$tauri_manifest"
          TAURI_ANDROID_PROJECT_DIR="$(dirname "$tauri_manifest")/mobile/android" \
            src-tauri/gen/android/gradlew \
            -p plugins/push-android/android \
            testDebugUnitTest

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - run: cargo check -p nelomai-windows-service --all-targets
      - run: cargo check -p nelomai-app
      - run: cargo test -p nelomai-client-updater
      - run: cargo test -p nelomai-windows-service

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - run: cargo check -p nelomai-unix-service --all-targets
      - run: cargo check -p nelomai-app
      - run: cargo test -p nelomai-unix-service

  contracts-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "cryptography>=45,<46"
      - run: python contracts/python/validate_fixtures.py
      - run: python scripts/release-workflow-check.py
