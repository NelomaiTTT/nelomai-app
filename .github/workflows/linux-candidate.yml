name: Linux signed test candidate

on:
  push:
    branches: [Future/linux-hot-standby-0.4.0]
    paths:
      - .github/workflows/linux-candidate.yml
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-hex HEAD of Future/linux-hot-standby-0.4.0; nonpublishable Linux 0.4.0 candidate
        type: string
        required: true

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  SOURCE_SHA: ${{ github.event_name == 'push' && github.sha || inputs.source_sha }}
  GH_TOKEN: ${{ github.token }}
  NELOMAI_RELEASE_MANIFEST_PUBLIC_KEY_B64: ${{ vars.NELOMAI_RELEASE_MANIFEST_PUBLIC_KEY_B64 }}
  NELOMAI_UPDATER_PUBLIC_KEY: ${{ secrets.NELOMAI_UPDATER_PUBLIC_KEY }}

jobs:
  build:
    if: >-
      github.repository == 'NelomaiTTT/nelomai-app' &&
      github.ref == 'refs/heads/Future/linux-hot-standby-0.4.0' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.sha == inputs.source_sha))
    runs-on: [self-hosted, Linux, X64, nelomai-040-linux-vm]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Exact source and keyless host before local code
        id: guard
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          test "$GITHUB_REPOSITORY" = NelomaiTTT/nelomai-app
          test "$GITHUB_REF" = refs/heads/Future/linux-hot-standby-0.4.0
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse refs/remotes/origin/Future/linux-hot-standby-0.4.0)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          for name in NELOMAI_RELEASE_MANIFEST_PRIVATE_KEY_B64 TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD ANDROID_KEYSTORE_PATH ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD NELOMAI_MACOS_SIGNING_P12_BASE64 NELOMAI_MACOS_SIGNING_P12_PASSWORD APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_API_KEY APPLE_API_KEY_PATH; do
            test -z "${!name:-}"
          done
          echo "RUN_ROOT=$(mktemp -d "$RUNNER_TEMP/linux-candidate.XXXXXX")" >> "$GITHUB_ENV"
      - uses: ./.github/actions/release-native-host
        with:
          node24: 'true'
          platform: linux
          target: x86_64-unknown-linux-gnu
      - name: Exact source and native workspace before candidate build
        run: |
          python scripts/linux-candidate.py source --source-sha "$SOURCE_SHA" --keyless
          cargo fmt --all --check
          cargo test --locked --workspace
          cargo build --locked -p nelomai-contracts --bin verify-runtime-manifest
          cargo build --locked -p nelomai-client-updater --example verify-updater-signature
          python -m unittest scripts.tests.test_linux_candidate scripts.tests.test_linux_test_package
      - name: Build Linux latest with production public pins only
        run: |
          python scripts/prepare-release-trust.py --mode sign_candidate --public-key "$RUN_ROOT/runtime-public.raw"
          python scripts/build-release-platform.py --mode sign_candidate --source-sha "$SOURCE_SHA" \
            --platform linux --architecture x86_64 --public-key "$RUN_ROOT/runtime-public.raw" \
            --output "$RUN_ROOT/draft" --work "$RUN_ROOT/native-work"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-candidate-draft
          path: |
            ${{ env.RUN_ROOT }}/draft/latest/
            ${{ env.RUN_ROOT }}/draft/draft-public-key.raw
            ${{ env.RUN_ROOT }}/draft/runtime-public-key.raw
            ${{ env.RUN_ROOT }}/draft/linux-x86_64.sizes.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove native draft test keys and work
        if: always()
        run: |
          if [[ -n "${RUN_ROOT:-}" && "$RUN_ROOT" == "$RUNNER_TEMP"/linux-candidate.* ]]; then rm -rf -- "$RUN_ROOT"; fi

  sign:
    needs: build
    if: >-
      github.repository == 'NelomaiTTT/nelomai-app' &&
      github.ref == 'refs/heads/Future/linux-hot-standby-0.4.0' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.sha == inputs.source_sha))
    environment: release-candidate-signing
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Exact source and keyless host before local code
        id: guard
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          test "$GITHUB_REPOSITORY" = NelomaiTTT/nelomai-app
          test "$GITHUB_REF" = refs/heads/Future/linux-hot-standby-0.4.0
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse refs/remotes/origin/Future/linux-hot-standby-0.4.0)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          for name in NELOMAI_RELEASE_MANIFEST_PRIVATE_KEY_B64 TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD ANDROID_KEYSTORE_PATH ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD NELOMAI_MACOS_SIGNING_P12_BASE64 NELOMAI_MACOS_SIGNING_P12_PASSWORD APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_API_KEY APPLE_API_KEY_PATH; do
            test -z "${!name:-}"
          done
          echo "RUN_ROOT=$(mktemp -d "$RUNNER_TEMP/linux-candidate.XXXXXX")" >> "$GITHUB_ENV"
      - uses: ./.github/actions/release-native-host
        with:
          node24: 'true'
          purpose: signing
          platform: linux
          target: x86_64-unknown-linux-gnu
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Source and crypto security tests before private keys
        run: |
          npm ci
          python scripts/linux-candidate.py source --source-sha "$SOURCE_SHA" --keyless
          cargo build --locked -p nelomai-contracts --bin verify-runtime-manifest
          cargo build --locked -p nelomai-client-updater --example verify-updater-signature
          python -m unittest scripts.tests.test_linux_candidate scripts.tests.test_runtime_artifact scripts.tests.test_linux_test_package
          python scripts/prepare-release-trust.py --mode sign_candidate --public-key "$RUN_ROOT/runtime-public.raw"
      - uses: actions/download-artifact@v4
        with:
          name: linux-candidate-draft
          path: ${{ env.RUN_ROOT }}/draft
      - name: Authenticate only pinned stable Linux membership
        run: |
          python scripts/linux-candidate.py stable --source-sha "$SOURCE_SHA" \
            --public-key "$RUN_ROOT/runtime-public.raw" --output "$RUN_ROOT/stable"
      - name: Sign Linux latest and its two-slot container
        env:
          NELOMAI_RELEASE_MANIFEST_PRIVATE_KEY_B64: ${{ secrets.NELOMAI_RELEASE_MANIFEST_PRIVATE_KEY_B64 }}
        run: |
          trap 'rm -f "$RUN_ROOT/runtime-private.raw"' EXIT
          python scripts/prepare-release-trust.py --mode sign_candidate --phase signing \
            --public-key "$RUN_ROOT/signing-public.raw" --private-key "$RUN_ROOT/runtime-private.raw"
          python scripts/linux-candidate.py sign --source-sha "$SOURCE_SHA" \
            --draft "$RUN_ROOT/draft" --stable "$RUN_ROOT/stable" --output "$RUN_ROOT/signed" \
            --private-key "$RUN_ROOT/runtime-private.raw" --public-key "$RUN_ROOT/runtime-public.raw" \
            --stable-public-key "$RUN_ROOT/runtime-public.raw"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-candidate-signed-runtime
          path: ${{ env.RUN_ROOT }}/signed/
          if-no-files-found: error
          retention-days: 7
      - name: Remove protected signing work
        if: always()
        run: |
          if [[ -n "${RUN_ROOT:-}" && "$RUN_ROOT" == "$RUNNER_TEMP"/linux-candidate.* ]]; then rm -rf -- "$RUN_ROOT"; fi

  package:
    needs: sign
    if: >-
      github.repository == 'NelomaiTTT/nelomai-app' &&
      github.ref == 'refs/heads/Future/linux-hot-standby-0.4.0' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.sha == inputs.source_sha))
    runs-on: [self-hosted, Linux, X64, nelomai-040-linux-vm]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Exact source and keyless host before local code
        id: guard
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          test "$GITHUB_REPOSITORY" = NelomaiTTT/nelomai-app
          test "$GITHUB_REF" = refs/heads/Future/linux-hot-standby-0.4.0
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse refs/remotes/origin/Future/linux-hot-standby-0.4.0)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          for name in NELOMAI_RELEASE_MANIFEST_PRIVATE_KEY_B64 TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD ANDROID_KEYSTORE_PATH ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD NELOMAI_MACOS_SIGNING_P12_BASE64 NELOMAI_MACOS_SIGNING_P12_PASSWORD APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_API_KEY APPLE_API_KEY_PATH; do
            test -z "${!name:-}"
          done
          echo "RUN_ROOT=$(mktemp -d "$RUNNER_TEMP/linux-candidate.XXXXXX")" >> "$GITHUB_ENV"
      - uses: ./.github/actions/release-native-host
        with:
          node24: 'true'
          purpose: packaging
          platform: linux
          target: x86_64-unknown-linux-gnu
      - name: Install Linux AppImage packaging dependency
        run: |
          sudo apt-get install -y xdg-utils
          test -x /usr/bin/xdg-open
      - name: Exact keyless source and public verifiers
        run: |
          python scripts/linux-candidate.py source --source-sha "$SOURCE_SHA" --keyless
          cargo build --locked -p nelomai-contracts --bin verify-runtime-manifest
          python scripts/prepare-release-trust.py --mode sign_candidate --public-key "$RUN_ROOT/runtime-public.raw"
      - uses: actions/download-artifact@v4
        with:
          name: linux-candidate-signed-runtime
          path: ${{ env.RUN_ROOT }}/signed
      - name: Package Linux AppImage and verify its extracted signed bytes
        run: |
          python scripts/linux-candidate.py package --source-sha "$SOURCE_SHA" \
            --signed "$RUN_ROOT/signed" --output "$RUN_ROOT/packages" \
            --public-key "$RUN_ROOT/runtime-public.raw" --stable-public-key "$RUN_ROOT/runtime-public.raw"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-candidate-package
          path: |
            ${{ env.RUN_ROOT }}/packages/shipping/
            ${{ env.RUN_ROOT }}/packages/package-digests.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove native packaging work
        if: always()
        run: |
          if [[ -n "${RUN_ROOT:-}" && "$RUN_ROOT" == "$RUNNER_TEMP"/linux-candidate.* ]]; then rm -rf -- "$RUN_ROOT"; fi

  finalize:
    needs: package
    if: >-
      github.repository == 'NelomaiTTT/nelomai-app' &&
      github.ref == 'refs/heads/Future/linux-hot-standby-0.4.0' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.sha == inputs.source_sha))
    environment: release-candidate-finalization
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Exact source and keyless host before local code
        id: guard
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          test "$GITHUB_REPOSITORY" = NelomaiTTT/nelomai-app
          test "$GITHUB_REF" = refs/heads/Future/linux-hot-standby-0.4.0
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse refs/remotes/origin/Future/linux-hot-standby-0.4.0)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          for name in NELOMAI_RELEASE_MANIFEST_PRIVATE_KEY_B64 TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD ANDROID_KEYSTORE_PATH ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD NELOMAI_MACOS_SIGNING_P12_BASE64 NELOMAI_MACOS_SIGNING_P12_PASSWORD APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_API_KEY APPLE_API_KEY_PATH; do
            test -z "${!name:-}"
          done
          echo "RUN_ROOT=$(mktemp -d "$RUNNER_TEMP/linux-candidate.XXXXXX")" >> "$GITHUB_ENV"
      - uses: ./.github/actions/release-native-host
        with:
          node24: 'true'
          purpose: signing
          platform: linux
          target: x86_64-unknown-linux-gnu
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Source and package security tests before updater private key
        run: |
          npm ci
          python scripts/linux-candidate.py source --source-sha "$SOURCE_SHA" --keyless
          cargo build --locked -p nelomai-contracts --bin verify-runtime-manifest
          cargo build --locked -p nelomai-client-updater --example verify-updater-signature
          python -m unittest scripts.tests.test_linux_candidate scripts.tests.test_runtime_artifact scripts.tests.test_linux_test_package
          python scripts/prepare-release-trust.py --mode sign_candidate --public-key "$RUN_ROOT/runtime-public.raw"
      - uses: actions/download-artifact@v4
        with:
          name: linux-candidate-signed-runtime
          path: ${{ env.RUN_ROOT }}/signed
      - uses: actions/download-artifact@v4
        with:
          name: linux-candidate-package
          path: ${{ env.RUN_ROOT }}/packages
      - name: Sign unchanged AppImage and independently verify updater signature
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          python scripts/linux-candidate.py finalize --source-sha "$SOURCE_SHA" \
            --packages "$RUN_ROOT/packages" --signed "$RUN_ROOT/signed" --output "$RUN_ROOT/candidate" \
            --public-key "$RUN_ROOT/runtime-public.raw" --stable-public-key "$RUN_ROOT/runtime-public.raw"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-test-candidate-0.4.0-${{ env.SOURCE_SHA }}
          path: ${{ env.RUN_ROOT }}/candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Remove protected finalization work
        if: always()
        run: |
          if [[ -n "${RUN_ROOT:-}" && "$RUN_ROOT" == "$RUNNER_TEMP"/linux-candidate.* ]]; then rm -rf -- "$RUN_ROOT"; fi
