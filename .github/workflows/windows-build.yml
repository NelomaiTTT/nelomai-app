name: Windows checks and diagnostics

on:
  workflow_dispatch:
    inputs:
      startup_diagnostics:
        description: "Диагностический Windows-установщик с журналом запуска, без публикации"
        type: boolean
        default: false
      download_diagnostics_only:
        description: "Только сравнить загрузку закреплённого архива, без сборки и секретов"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  startup-diagnostic:
    if: inputs.startup_diagnostics && !inputs.download_diagnostics_only
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      NELOMAI_RELEASE_MANIFEST_PUBLIC_KEY_B64: ${{ vars.NELOMAI_RELEASE_MANIFEST_PUBLIC_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/release-native-host
        with:
          platform: windows
          target: x86_64-pc-windows-msvc
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '10073502643'
          path: signed
          run-id: 34267783952
          merge-multiple: true
          github-token: ${{ github.token }}
      - name: Проверить диагностический журнал
        run: python -m unittest scripts/tests/test_startup_diagnostics.py
      - name: Собрать только диагностический управляющий слой
        run: python scripts/windows/build-startup-diagnostic.py
      - uses: actions/upload-artifact@v4
        with:
          name: nelomai-windows-startup-diagnostic
          path: startup-diagnostic/delivery/
          if-no-files-found: error
          retention-days: 7
  download-diagnostics:
    if: inputs.download_diagnostics_only && !inputs.startup_diagnostics
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Проверить TLS и SHA-256 двумя curl
        shell: pwsh
        run: ./scripts/windows/check-toolchain-download.ps1
  build:
    if: ${{ !inputs.download_diagnostics_only && !inputs.startup_diagnostics }}
    name: Windows x86_64 checks
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Update Rustup trust before toolchain downloads
        shell: bash
        run: if command -v rustup >/dev/null; then if [[ "$RUNNER_OS" == macOS ]] && brew list --versions rustup >/dev/null 2>&1; then brew update; brew upgrade rustup; echo "$(brew --prefix rustup)/bin" >> "$GITHUB_PATH"; else rustup self update; fi; fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - run: npm ci
      - name: Проверить интерфейс приложения
        run: npm test
      - name: Проверить Windows-службу
        run: |
          ./scripts/windows/test-member-file-operations.ps1
          cargo test --target x86_64-pc-windows-msvc -p nelomai-windows-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Где собрать установщик
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Установщик Windows собирается через release.yml. Для подписанного кандидата без публикации выберите sign_candidate.'
