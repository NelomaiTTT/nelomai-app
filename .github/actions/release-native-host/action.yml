name: Native release build host
description: Pinned compiler and ordinary build dependencies; no signing credentials
inputs:
  platform:
    required: true
    description: Native platform
  target:
    required: true
    description: Rust target
  purpose:
    default: 'build'
    description: build, packaging, signing or finalization; only install tools consumed by this phase
  android-fixtures:
    default: 'false'
    description: Provision mandatory compiled Android fixture dependencies on the verifier host
  node24:
    default: 'false'
    description: Opt in to Node 24 actions on compatible runners
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      if: inputs.purpose != 'signing' && inputs.node24 != 'true'
      with:
        node-version-file: .nvmrc
        cache: npm
    - uses: actions/setup-node@v7.1.0
      if: inputs.purpose != 'signing' && inputs.node24 == 'true'
      with:
        node-version-file: .nvmrc
        cache: npm
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Bootstrap Python trust after emSign incident
      shell: bash
      run: |
        python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
        python -m pip install "certifi==2026.10.19"
    - name: Update Rustup trust before toolchain downloads
      shell: bash
      run: if command -v rustup >/dev/null; then if [[ "$RUNNER_OS" == macOS ]] && brew list --versions rustup >/dev/null 2>&1; then brew update; brew upgrade rustup; echo "$(brew --prefix rustup)/bin" >> "$GITHUB_PATH"; else rustup self update; fi; fi
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.88.0
        targets: ${{ inputs.target }}
        components: rustfmt, clippy
    - uses: actions/setup-go@v5
      if: inputs.purpose == 'build'
      with:
        go-version: '1.26.10'
    - uses: actions/setup-java@v4
      if: inputs.platform == 'android' || inputs.android-fixtures == 'true'
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      if: inputs.platform == 'android' || inputs.android-fixtures == 'true'
      with:
        packages: ''
    - uses: gradle/actions/setup-gradle@v4
      if: inputs.platform == 'android' && (inputs.purpose == 'build' || inputs.purpose == 'packaging')
    - name: Linux build dependencies
      if: inputs.platform == 'linux' && (inputs.purpose == 'build' || inputs.purpose == 'packaging')
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
    - name: Android SDK and mandatory fixture toolchain
      if: (inputs.platform == 'android' && inputs.purpose != 'finalization') || inputs.android-fixtures == 'true'
      shell: bash
      run: |
        sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
        echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
    - name: Android signing tools only
      if: inputs.purpose == 'finalization'
      shell: bash
      run: sdkmanager 'build-tools;36.0.0'
    - name: Fixed Android Go archive
      if: inputs.platform == 'android' && inputs.purpose == 'build'
      shell: bash
      run: |
        archive="$RUNNER_TEMP/go1.26.10.linux-amd64.tar.gz"
        curl --fail --location --retry 3 https://go.dev/dl/go1.26.10.linux-amd64.tar.gz --output "$archive"
        echo "ccfe7ae822d2c2f41f4fe7c956199967a4dac22d0ee0d2b2bfdb440aab3b20c5  $archive" | sha256sum --check --strict
        echo "NELOMAI_GO_ARCHIVE=$archive" >> "$GITHUB_ENV"
    - shell: bash
      run: python -m pip install 'cryptography>=45,<46' 'PyYAML>=6,<7' 'packaging>=24,<27'
    - shell: bash
      if: inputs.purpose != 'signing'
      run: npm ci
