name: Native release build host
description: Pinned compiler and ordinary build dependencies; no signing credentials
inputs:
  platform:
    required: true
    description: Native platform
  target:
    required: true
    description: Rust target
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.88.0
        targets: ${{ inputs.target }}
        components: rustfmt, clippy
    - uses: actions/setup-go@v5
      if: inputs.platform != 'windows'
      with:
        go-version: '1.25.0'
    - uses: actions/setup-java@v4
      if: inputs.platform == 'android'
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      if: inputs.platform == 'android'
    - uses: gradle/actions/setup-gradle@v4
      if: inputs.platform == 'android'
    - name: Linux build dependencies
      if: inputs.platform == 'linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
    - name: Android SDK and fixed Go archive
      if: inputs.platform == 'android'
      shell: bash
      run: |
        sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
        echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
        archive="$RUNNER_TEMP/go1.25.0.linux-amd64.tar.gz"
        curl --fail --location --retry 3 https://go.dev/dl/go1.25.0.linux-amd64.tar.gz --output "$archive"
        echo "2852af0cb20a13139b3448992e69b868e50ed0f8a1e5940ee1de9e19a123b613  $archive" | sha256sum --check --strict
        echo "NELOMAI_GO_ARCHIVE=$archive" >> "$GITHUB_ENV"
    - shell: bash
      run: python -m pip install 'cryptography>=45,<46' 'PyYAML>=6,<7'
    - shell: bash
      run: npm ci
