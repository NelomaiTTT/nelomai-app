[package]
name = "nelomai-client-storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64 = "0.22"
nelomai-contracts = { path = "../contracts" }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "4.1", default-features = false, features = ["v1"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"
keyring-core = "1"
