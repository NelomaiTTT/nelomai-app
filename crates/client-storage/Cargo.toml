[package]
name = "nelomai-client-storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64 = "0.22"
nelomai-contracts = { path = "../contracts" }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
# Record checksums require parsing serialized f64 values without rounding drift.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
uuid = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
chacha20poly1305 = "0.10"
rustix = { version = "1.1", features = ["fs"] }
security-framework = "3.7"
security-framework-sys = "2.17"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "4.1", default-features = false, features = ["v1"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"
keyring-core = "1"

[dev-dependencies]
ed25519-dalek = "2.2"
