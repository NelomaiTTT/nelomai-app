[package]
name = "nelomai-client-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
futures-util = "0.3"
nelomai-contracts = { path = "../contracts" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dependencies]
tokio = { version = "1", features = ["rt", "net", "sync", "time", "io-util", "macros"] }
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(target_os = "linux")'.dependencies]
hickory-proto = { version = "0.24", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_Dns", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hickory-proto = { version = "0.24", default-features = false }
