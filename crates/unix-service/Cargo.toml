[package]
name = "nelomai-unix-service"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
base64 = "0.22"
ipnet = "2"
libc = "0.2"
nelomai-client-tunnel = { path = "../client-tunnel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "sync"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
defguard_boringtun = { version = "=0.6.5", default-features = false, features = ["device"] }
defguard_wireguard_rs = { version = "=0.10.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
defguard_boringtun = { version = "=0.6.5", default-features = false, features = ["device"] }
defguard_wireguard_rs = { version = "=0.10.0", default-features = false }

[[bin]]
name = "nelomai-unix-service"
path = "src/main.rs"
