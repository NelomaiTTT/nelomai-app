[package]
name = "nelomai-client-container"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
startup-diagnostics = []

[dependencies]
async-trait = "0.1"
nelomai-client-api = { path = "../client-api" }
nelomai-client-core = { path = "../client-core" }
nelomai-client-tunnel = { path = "../client-tunnel" }
nelomai-client-storage = { path = "../client-storage" }
nelomai-client-updater = { path = "../client-updater" }
nelomai-contracts = { path = "../contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "io-util", "net", "rt"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
ed25519-dalek = "2.2"
nelomai-client-application = { path = "../client-application" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[target.'cfg(unix)'.dev-dependencies]
nelomai-unix-service = { path = "../unix-service" }
